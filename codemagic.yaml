workflows:
  android-apk:
    name: Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      java: 21
      android_signing:
        - tabebik
    scripts:
      - name: Check project files
        script: |
          test -f pubspec.yaml || { echo "pubspec.yaml not found in the repo root"; exit 1; }
          test -f lib/main.dart || { echo "lib/main.dart not found"; exit 1; }

      - name: Generate Android project with the canonical Tabebik package ID
        script: |
          cp lib/main.dart /tmp/main.dart.bak
          flutter create --platforms=android --org com.tabebik --project-name tabebik_doctor .
          # Remove stale legacy Kotlin source to prevent duplicate MainActivity declarations.
          rm -f android/app/src/main/kotlin/app/tabibak/tabibak_doctor/MainActivity.kt
          find android/app/src/main/kotlin -type d -empty -delete
          # Align generated Android files with Flutter 3.50 toolchain (Gradle 9.5.0, AGP 9.3.1, Java 17).
          python3 - <<'PY'
          from pathlib import Path
          import re

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          text = wrapper.read_text()
          text, count = re.subn(r"gradle-[0-9.]+-all[.]zip", "gradle-9.5.0-all.zip", text)
          if count != 1:
              raise SystemExit("Could not set Gradle wrapper to 9.5.0")
          wrapper.write_text(text)

          settings = Path("android/settings.gradle.kts")
          if settings.exists():
              text = settings.read_text()
              text, count = re.subn(r'id[(]"com[.]android[.]application"[)] version "[^"]+" apply false',
                                    'id("com.android.application") version "9.3.1" apply false', text)
              if count != 1:
                  raise SystemExit("Could not set Android Gradle Plugin to 9.3.1")
              text = "\n".join(line for line in text.splitlines() if 'id("org.jetbrains.kotlin.android")' not in line) + "\n"
              settings.write_text(text)

          app = Path("android/app/build.gradle.kts")
          if app.exists():
              text = app.read_text()
              text = text.replace('    id("kotlin-android")', '')
              text = text.replace("JavaVersion.VERSION_11", "JavaVersion.VERSION_17")
              text = re.sub(r"\n    kotlinOptions\s*\{.*?\n    \}", "", text, flags=re.S)
              kotlin_block = "\nkotlin {\n    compilerOptions {\n        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17\n    }\n}\n"
              text = text.replace("\nflutter {", kotlin_block + "\nflutter {")
              app.write_text(text)


          # Work around the Android Lint CommentDetector crash in release dependencies.
          # Disable only lintVital* tasks across Android subprojects.
          root_build = Path("android/build.gradle.kts")
          if root_build.exists():
              root_text = root_build.read_text()
              lint_workaround = '''
          // Temporary workaround for Android Lint CommentDetector NoSuchMethodError.
          subprojects {
              tasks.configureEach {
                  if (name.startsWith("lintVital")) {
                      enabled = false
                  }
              }
          }
          '''
              if 'name.startsWith("lintVital")' not in root_text:
                  root_build.write_text(root_text.rstrip() + "\n" + lint_workaround)

          gradle_props = Path("android/gradle.properties")
          props = gradle_props.read_text()
          if "android.builtInKotlin=true" not in props:
              gradle_props.write_text(props.rstrip() + chr(10) + "android.builtInKotlin=true" + chr(10))

          print(wrapper.read_text())
          print(settings.read_text())
          PY
          cp /tmp/main.dart.bak lib/main.dart
          rm -f test/widget_test.dart

      - name: Configure release signing
        script: |
          set -e

          # Configure the same Codemagic release keystore used by tabebik_user.
          python3 - <<'PY'
          from pathlib import Path

          app = Path("android/app/build.gradle.kts")
          if not app.exists():
              raise SystemExit("Expected android/app/build.gradle.kts after flutter create")
          text = app.read_text()

          signing = '''
              signingConfigs {
                  create("release") {
                      if (System.getenv("CI") == "true") {
                          storeFile = file(requireNotNull(System.getenv("CM_KEYSTORE_PATH")) {
                              "CM_KEYSTORE_PATH is missing. Check Codemagic android_signing configuration."
                          })
                          storePassword = requireNotNull(System.getenv("CM_KEYSTORE_PASSWORD")) {
                              "CM_KEYSTORE_PASSWORD is missing from Codemagic."
                          }
                          keyAlias = requireNotNull(System.getenv("CM_KEY_ALIAS")) {
                              "CM_KEY_ALIAS is missing from Codemagic."
                          }
                          keyPassword = requireNotNull(System.getenv("CM_KEY_PASSWORD")) {
                              "CM_KEY_PASSWORD is missing from Codemagic."
                          }
                      }
                  }
              }

          '''
          if 'create("release")' not in text:
              marker = "    buildTypes {"
              if marker not in text:
                  raise SystemExit("Could not find buildTypes block in generated Gradle file")
              text = text.replace(marker, signing + marker, 1)

          debug_release = 'signingConfig = signingConfigs.getByName("debug")'
          ci_release = '''signingConfig = if (System.getenv("CI") == "true") {
                          signingConfigs.getByName("release")
                      } else {
                          signingConfigs.getByName("debug")
                      }'''
          if debug_release in text:
              text = text.replace(debug_release, ci_release, 1)
          elif 'signingConfigs.getByName("release")' not in text:
              raise SystemExit("Could not locate release signingConfig in generated Gradle file")

          app.write_text(text)
          print("Configured CI release signing with Codemagic keystore.")
          PY

      - name: Ensure internet permission
        script: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" "$MANIFEST" || \
            perl -0pi -e 's/(<manifest[^>]*>)/$1\n    <uses-permission android:name="android.permission.INTERNET"\/>/' "$MANIFEST"

      - name: Get packages
        script: flutter pub get

      - name: Analyze
        script: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        script: flutter build apk --release --no-tree-shake-icons --build-number=$BUILD_NUMBER


      - name: Print Android SHA-1 and SHA-256 fingerprints
        script: |
          set -e
          echo "========== TABEBIK ANDROID SIGNING FINGERPRINTS =========="
          cd android
          ./gradlew --no-daemon :app:signingReport
          echo "========== END SIGNING FINGERPRINTS =========="

    artifacts:
      - build/**/outputs/**/*.apk
