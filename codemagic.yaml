workflows:
  android-apk:
    name: Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Check project files
        script: |
          test -f pubspec.yaml || { echo "pubspec.yaml not found in the repo root"; exit 1; }
          test -f lib/main.dart || { echo "lib/main.dart not found"; exit 1; }

      - name: Generate Android project with the canonical Tabebik package ID
        script: |
          cp lib/main.dart /tmp/main.dart.bak
          flutter create --platforms=android --org com.tabebik --project-name tabebik_doctor .
          # Align generated Android files with Flutter 3.50 toolchain (Gradle 9.5.0, AGP 9.3.1, Java 17).
          python3 - <<'PY'
          from pathlib import Path
          import re

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          text = wrapper.read_text()
          text, count = re.subn(r"gradle-[0-9.]+-all[.]zip", "gradle-9.5.0-all.zip", text)
          if count != 1:
              raise SystemExit("Could not set Gradle wrapper to 9.5.0")
          wrapper.write_text(text)

          settings = Path("android/settings.gradle.kts")
          if settings.exists():
              text = settings.read_text()
              text, count = re.subn(r'id[(]"com[.]android[.]application"[)] version "[^"]+" apply false',
                                    'id("com.android.application") version "9.3.1" apply false', text)
              if count != 1:
                  raise SystemExit("Could not set Android Gradle Plugin to 9.3.1")
              text = "\n".join(line for line in text.splitlines() if 'id("org.jetbrains.kotlin.android")' not in line) + "\n"
              settings.write_text(text)

          app = Path("android/app/build.gradle.kts")
          if app.exists():
              text = app.read_text()
              text = text.replace('    id("kotlin-android")', '')
              text = text.replace("JavaVersion.VERSION_11", "JavaVersion.VERSION_17")
              text = re.sub(r"\n    kotlinOptions\s*\{.*?\n    \}", "", text, flags=re.S)
              kotlin_block = "\nkotlin {\n    compilerOptions {\n        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17\n    }\n}\n"
              text = text.replace("\nflutter {", kotlin_block + "\nflutter {")
              app.write_text(text)

          gradle_props = Path("android/gradle.properties")
          props = gradle_props.read_text()
          if "android.builtInKotlin=true" not in props:
              gradle_props.write_text(props.rstrip() + chr(10) + "android.builtInKotlin=true" + chr(10))

          print(wrapper.read_text())
          print(settings.read_text())
          PY
          cp /tmp/main.dart.bak lib/main.dart
          rm -f test/widget_test.dart

      - name: Ensure internet permission
        script: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" "$MANIFEST" || \
            perl -0pi -e 's/(<manifest[^>]*>)/$1\n    <uses-permission android:name="android.permission.INTERNET"\/>/' "$MANIFEST"

      - name: Get packages
        script: flutter pub get

      - name: Analyze
        script: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        script: flutter build apk --release --no-tree-shake-icons --build-number=$BUILD_NUMBER

    artifacts:
      - build/**/outputs/**/*.apk
